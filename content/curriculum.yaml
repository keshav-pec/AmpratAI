# AmpratAI curriculum — machine-readable source of truth
#
# Consumed by the platform (05-PLATFORM-SPEC.md §11) and synced to MongoDB.
# Human-readable version: docs/02-ROADMAP.md
#
# STAGES ARE CONTENT UNITS, NOT CALENDAR MONTHS. No deadlines, no time boxes,
# no quotas anywhere in this file by design. `readiness` lists are self-checks,
# never locks.
#
# Topics are fully expanded for Stage 1 and for s3.4 as a worked example
# (docs/04-CURRICULUM-MAP.md §5-6). Everything else carries module-level shape;
# topic detail is authored one stage ahead of where the learner is.

version: 2
platform:
  name: AmpratAI
  assistant_name: Amprat Assistant
  built_by: claude            # the learner does not build or maintain this
  progress_storage: server    # MongoDB Atlas; same state on every device
  blocking_gates: false       # readiness lists are advisory only
  streaks: false
  deadlines: false
  time_boxes: false

learner:
  slug: fullstack-ai-engineer
  summary: >
    MERN full stack. Strong React, Node, Mongo; many deployed projects.
    Python low-medium. SQL via MySQL. 300+ DSA problems solved.
    Basic RAG knowledge plus one simple RAG project already built.
  transfers: [rest-apis, async-js, react, auth, sql, schema-design, deployment, shipping-habit]
  real_gaps: [asyncio, pydantic, fastapi, docker, cloud, llm-apis, agents, mcp,
              evals, observability, ai-system-design, cost-engineering, queues]
  partial_gaps: [postgres-specifics, pgvector, rag-depth, context-engineering]
  already_done: [dsa]         # no easy problems anywhere; sharpening only
  effort_estimate_hours: [650, 800]

content_rules:
  language_standard: docs/04-CURRICULUM-MAP.md#2
  sources_per_topic: { videos_max: 3, decks_max: 1, each_needs_reason: true }
  progress_tracks: topic       # not source — any one source completes the topic
  notes: system_written        # learner uses a physical notebook; no note UI
  printable_summary: required  # one A4 page per topic
  fullscreen: [video, slides, animation]

practice_mix:                  # concepts first; code mostly with AI assistance
  core_primitive: 0.05         # hand-written, no AI — ~10 across the whole path
  read_and_predict: 0.25
  spec_then_verify: 0.25       # you spec, AI implements, you review and fix
  tool_drill: 0.30             # real tools, verified via live API calls
  decision_drill: 0.15         # no code; pick an approach and defend it
  break_it_per_module: true

hand_written_primitives:       # the only things built without AI
  - cosine similarity
  - a recursive chunker with overlap
  - reciprocal rank fusion
  - an agent loop with budgets
  - a retry wrapper with exponential backoff and jitter
  - a token budgeter
  - a streaming response parser
  - a bounded-concurrency semaphore pool
  - a tool-schema generator from a function signature
  - a token-bucket rate limiter

optional_practices:            # genuinely optional; nothing depends on them
  dsa_sharpening: { level: [medium, hard], quota: none, easy_problems: never }
  public_writing: { required: false, drafted_by: assistant }
  break_it_drills: { recommended: true, required: false }

stages:

  # ─────────────────────────────────────────────────────────── STAGE 1
  - idx: 1
    code: s1
    title: Python where it matters, and the backend gaps
    outcome: >
      I can build, test, containerise and deploy a typed, async Python API with
      Postgres and pgvector behind it.
    note: Deliberately small. Skip anything you test out of — each module has a self-check.
    modules:
      - code: s1.1
        title: Python for AI code
        priority: core
        tier: S
        self_check: >
          Skip this module if you can write a decorator that times a function,
          explain what yield does, use a context manager, and read a type-hinted
          signature with Optional and generics.
        topics:
          - { idx: 1, title: "Decorators and what they're really doing" }
          - { idx: 2, title: "Context managers and cleanup" }
          - { idx: 3, title: "Generators and yield" }
          - { idx: 4, title: "Type hints, generics, Protocol (the TypeScript mental model)" }
          - { idx: 5, title: "Traps that catch JS developers" }
      - code: s1.2
        title: Pydantic v2
        priority: core
        tier: S
        note: The most important module in this stage. Pydantic is the type system of the AI ecosystem.
        topics:
          - { idx: 1, title: "Models, validation, model_validate and model_dump" }
          - { idx: 2, title: "Field constraints and custom validators" }
          - { idx: 3, title: "Settings and config with pydantic-settings" }
          - { idx: 4, title: "Why every AI library is built on this" }
      - code: s1.3
        title: Async Python
        priority: core
        tier: S
        topics:
          - { idx: 1, title: "asyncio vs the JS event loop", animations: [anim-event-loop-compare] }
          - { idx: 2, title: "gather, TaskGroup, cancellation" }
          - { idx: 3, title: "Bounded concurrency with Semaphore", animations: [anim-semaphore-throttle] }
          - { idx: 4, title: "httpx async: pooling, timeouts, backoff with jitter", animations: [anim-retry-backoff-jitter] }
          - { idx: 5, title: "Async generators and streaming" }
          - { idx: 6, title: "Threads, processes and the GIL in one page" }
      - code: s1.4
        title: Tooling and testing
        priority: core
        tier: S
        topics:
          - { idx: 1, title: "uv and pyproject" }
          - { idx: 2, title: "ruff" }
          - { idx: 3, title: "pytest with async and HTTP mocking" }
          - { idx: 4, title: "Structured logging and secret hygiene" }
      - code: s1.5
        title: FastAPI
        priority: core
        tier: S
        topics:
          - { idx: 1, title: "Routers, models, automatic OpenAPI" }
          - { idx: 2, title: "Dependency injection — the concept Express doesn't have" }
          - { idx: 3, title: "Middleware, exception handlers, CORS" }
          - { idx: 4, title: "Streaming responses and Server-Sent Events" }
          - { idx: 5, title: "Auth: API keys and JWT" }
          - { idx: 6, title: "Testing a FastAPI app" }
      - code: s1.6
        title: Postgres conversion (you know MySQL)
        priority: core
        tier: B
        note: Differences and AI-specific parts only. No SQL fundamentals.
        topics:
          - { idx: 1, title: "MySQL to Postgres: what actually bites" }
          - { idx: 2, title: "Reading Postgres EXPLAIN ANALYZE", animations: [anim-index-scan-vs-seek] }
          - { idx: 3, title: "GIN, partial and expression indexes; JSONB" }
          - { idx: 4, title: "Full-text search with tsvector", note: "needed for hybrid retrieval in s3.6" }
          - { idx: 5, title: "pgvector: columns, distance operators, HNSW and IVFFlat" }
      - code: s1.7
        title: Docker and local infrastructure
        priority: core
        tier: B
        topics:
          - { idx: 1, title: "Images, layers, a good Python Dockerfile", animations: [anim-docker-layers] }
          - { idx: 2, title: "docker compose: api, postgres, redis" }
          - { idx: 3, title: "Env, secrets, healthchecks" }
          - { idx: 4, title: "Deploying a container somewhere real" }
      - code: s1.8
        title: AI intuition — the cheap 8 hours
        priority: core
        tier: S
        note: >
          Conceptual only. No math homework, no derivations. Enough is when you can
          explain each one to a non-technical friend in two minutes.
        topics:
          - { idx: 1, title: "What a token is, and why JSON costs more than prose" }
          - { idx: 2, title: "Next-token prediction and why models hallucinate" }
          - { idx: 3, title: "What an embedding represents, and what similarity means" }
          - { idx: 4, title: "Temperature, attention, and how models get trained — the short version" }
    projects: [p-1.1, p-1.2]
    readiness:                 # self-check, never a lock
      - "A FastAPI endpoint streaming SSE while making concurrent async calls with a cap — written without looking things up"
      - "You can explain what pydantic does when validation fails, and why that error is useful"
      - "docker compose up works on a clean machine"
      - "A pgvector table with an HNSW index exists, and you know what ef_search changes"
      - "Tokens, embeddings and temperature explainable without notes"

  # ─────────────────────────────────────────────────────────── STAGE 2
  - idx: 2
    code: s2
    title: LLM APIs and production prompting
    outcome: >
      I can build a reliable, streaming, cost-instrumented LLM feature against any of
      the three major providers, and get structured output I can trust.
    modules:
      - { code: s2.1, title: "What an LLM call actually is", priority: core, tier: S, topic_count: 6,
          animations: [anim-tokenizer, anim-temperature-distribution, anim-context-window-budget] }
      - { code: s2.2, title: "Streaming, end to end", priority: core, tier: S, topic_count: 5,
          animations: [anim-streaming-ttft], note: "your advantage — every project streams" }
      - { code: s2.3, title: "Production prompt engineering", priority: core, tier: S, topic_count: 8,
          animations: [anim-prompt-anatomy, anim-fewshot-selection] }
      - { code: s2.4, title: "Structured output you can trust", priority: core, tier: S, topic_count: 5,
          animations: [anim-structured-repair-loop] }
      - { code: s2.5, title: "Reliability and cost", priority: core, tier: S, topic_count: 6,
          animations: [anim-fallback-chain, anim-prompt-cache-hit] }
      - { code: s2.6, title: "Multimodal basics", priority: optional, tier: B, topic_count: 3 }
    projects: [p-2.1, p-2.2]
    readiness:
      - "One interface, three providers, same feature"
      - "Cancelling a stream actually stops upstream billing, provable in logs"
      - "You can state what one request costs, from your own instrumentation"
      - "Killing the primary provider key degrades gracefully instead of 500-ing"
      - "A prompts/ directory with versions; any output traces back to a version"
      - "You've hit five distinct prompt failure modes and know what fixed each"

  # ─────────────────────────────────────────────────────────── STAGE 3
  - idx: 3
    code: s3
    title: RAG for real, and how to know it works
    outcome: >
      I can build retrieval over a messy real corpus, measure its quality with numbers,
      and improve those numbers deliberately.
    opener:
      kind: audit
      title: Audit your existing RAG project
      detail: >
        Run the project you already built against 12 questions about ingestion, chunking,
        retrieval and measurement. Most will have no answer yet. That list is this stage's
        syllabus, and your project becomes version 1 of the results table in p-3.1.
    modules:
      - { code: s3.1, title: "The retrieval problem, properly", priority: core, tier: S, topic_count: 3,
          animations: [anim-rag-pipeline-overview] }
      - { code: s3.2, title: "Embeddings in practice", priority: core, tier: S, topic_count: 5,
          animations: [anim-embedding-space] }
      - { code: s3.3, title: "Ingestion — the unglamorous 60%", priority: core, tier: S, topic_count: 6 }
      - code: s3.4
        title: Chunking
        priority: core
        tier: S
        topics:
          - { idx: 1, title: "Fixed-size and recursive splitting" }
          - { idx: 2, title: "Token-aware sizing" }
          - idx: 3
            title: Structure-aware chunking
            # worked example — docs/04-CURRICULUM-MAP.md §5
            concepts:
              outcome: >
                You'll be able to look at a document and pick a chunking strategy from its
                shape, and predict what that choice does to your results.
              sources:
                - { kind: deck, id: chunking-strategies, slides: 14, label: Slides, role: main,
                    reason: "no single video covers structure-aware, parent-document and contextual retrieval together" }
                - { kind: youtube, label: Visual, role: alternate, reason: "shorter, diagram-led" }
                - { kind: youtube, label: Deeper, role: alternate, reason: "edge cases and internals" }
              analogy: >
                You split React apps by component, not by line count, because components are
                where meaning naturally ends. A markdown heading is the same kind of boundary.
                Cutting a document every 512 characters is like cutting a codebase every 512
                characters.
              animations: [anim-chunk-strategies, anim-parent-doc-retrieval]
              docs: ["LangChain text splitters", "Anthropic contextual retrieval", "pgvector README"]
              glossary: [chunk, overlap, parent-document retrieval, sentence window, contextual retrieval]
              printable: "one page: six strategies, when each wins, metadata to attach"
            practice:
              - { mode: read_and_predict, title: "Where does this recursive splitter cut this paragraph?" }
              - { mode: spec_then_verify, title: "Spec a header-aware splitter; review the AI implementation for no-heading, nested-heading and trailing-heading cases" }
              - { mode: tool_drill, title: "Four chunk sizes over a 200-page PDF into pgvector; submit the recall@5 table", verify: metrics-fingerprint }
              - { mode: decision_drill, title: "900-page regulatory PDF, clause-level questions — pick a strategy and say what you're trading away" }
              - { mode: break_it, title: "Overlap 0, chunk size 128. Find a question that now fails. Explain why." }
            mini_project: rolls-up-to:p-3.1
          - { idx: 4, title: "Semantic and propositional chunking" }
          - { idx: 5, title: "Parent-document and sentence-window retrieval", animations: [anim-parent-doc-retrieval] }
          - { idx: 6, title: "Contextual retrieval", animations: [anim-contextual-retrieval] }
          - { idx: 7, title: "Measuring chunk size against recall and cost on your own corpus" }
      - { code: s3.5, title: "Vector storage (pgvector primary, Qdrant contrast)", priority: core, tier: S,
          topic_count: 5, animations: [anim-hnsw-traversal] }
      - { code: s3.6, title: "Retrieval quality: hybrid, reranking, query understanding", priority: core,
          tier: S, topic_count: 6, animations: [anim-hybrid-rrf, anim-reranker, anim-query-rewriting] }
      - { code: s3.7, title: "Context assembly", priority: core, tier: A, topic_count: 5,
          animations: [anim-lost-in-middle, anim-context-window-budget] }
      - { code: s3.8, title: "Evaluation", priority: core, tier: A, topic_count: 7,
          animations: [anim-eval-loop, anim-judge-bias],
          note: "Promoted from the video's B-tier. Comes BEFORE s3.6 in the path — build the ruler first." }
    sequencing: [s3.1, s3.2, s3.3, s3.4, s3.5, s3.8, s3.6, s3.7]
    projects: [p-3.1, p-3.2]
    readiness:
      - "A hand-written golden set in the repo"
      - "The eval suite runs in CI and you've watched it fail a deliberately bad change"
      - "A before/after table: 6+ variants with recall@5, faithfulness, p95, INR per query"
      - "You can argue RAG vs long context vs fine-tuning from your own numbers"
      - "A hand error-analysis of 20 failures, grouped into categories"
      - "You can separate how much hybrid search helped from how much reranking helped"

  # ─────────────────────────────────────────────────────────── STAGE 4
  - idx: 4
    code: s4
    title: Tool use, agents, and MCP
    outcome: >
      I can build an agent that takes real actions safely, and I've published an MCP
      server other people's AI tools can use.
    modules:
      - { code: s4.1, title: "Tool calling, deeply", priority: core, tier: A, topic_count: 6,
          animations: [anim-tool-call-loop, anim-tool-description-matters] }
      - { code: s4.2, title: "The agent loop", priority: core, tier: A, topic_count: 5,
          animations: [anim-agent-loop],
          note: "hand-written primitive — no framework, ~60 lines" }
      - { code: s4.3, title: "Memory and state", priority: core, tier: A, topic_count: 4,
          animations: [anim-context-compaction] }
      - { code: s4.4, title: "Orchestration patterns", priority: core, tier: A, topic_count: 5,
          animations: [anim-orchestration-patterns, anim-human-in-loop],
          note: "multi-agent is usually the wrong default; learn it, then don't reach for it" }
      - { code: s4.5, title: "One framework: LangGraph", priority: core, tier: A, topic_count: 4,
          animations: [anim-langgraph-state] }
      - { code: s4.6, title: "MCP", priority: core, tier: A, topic_count: 5,
          animations: [anim-mcp-handshake, anim-mcp-vs-bespoke] }
      - { code: s4.7, title: "Agent safety and interface", priority: core, tier: A, topic_count: 5,
          animations: [anim-indirect-injection] }
    projects: [p-4.1, p-4.2]
    readiness:
      - "Your own agent loop, hand-written, with budget enforcement and loop detection"
      - "The same agent in LangGraph with Postgres checkpointing, resumable mid-run"
      - "An MCP server a stranger can install in one command"
      - "An approval gate that survives a server restart"
      - "An agent eval suite over 30+ scenarios, pass rate reported honestly"
      - "You can explain MCP vs A2A, and why multi-agent is usually the wrong default"

  # ─────────────────────────────────────────────────────────── STAGE 5
  - idx: 5
    code: s5
    title: AI system design, operations, and security
    outcome: >
      I can design, deploy, observe and defend a real AI system, and I have the
      dashboards and incident write-ups to prove it.
    modules:
      - { code: s5.1, title: "AI system design as a discipline", priority: core, tier: A, topic_count: 4,
          animations: [anim-ai-system-anatomy],
          practice_note: "whiteboard eight systems end to end, out loud, on paper" }
      - { code: s5.2, title: "Serving architecture", priority: core, tier: A, topic_count: 5,
          animations: [anim-queue-backpressure] }
      - { code: s5.3, title: "Caching, cost and routing", priority: core, tier: A, topic_count: 5,
          animations: [anim-cache-tiers, anim-model-routing] }
      - { code: s5.4, title: "Observability", priority: core, tier: A, topic_count: 5,
          animations: [anim-trace-waterfall] }
      - { code: s5.5, title: "Evaluation as engineering", priority: core, tier: A, topic_count: 5,
          animations: [anim-eval-ci-gate, anim-canary-rollback] }
      - { code: s5.6, title: "Security", priority: core, tier: A, topic_count: 5,
          animations: [anim-tenant-isolation-bug] }
      - { code: s5.7, title: "Deployment and CI/CD", priority: core, tier: B, topic_count: 5 }
      - { code: s5.8, title: "Fine-tuning: when, not how", priority: optional, tier: B, topic_count: 3,
          note: "video: overrated for 95% of AI engineers. Agreed." }
    projects: [p-5.1, p-5.2, p-5.3]
    readiness:
      - "One system on AWS or GCP, in containers, with CI/CD"
      - "Tracing across all three projects, and a cost dashboard you can screenshot"
      - "A CI eval gate blocking merges, demonstrated"
      - "A load-test report with a real p95 and a documented breaking point"
      - "Cost measurably reduced through caching and routing — you know the number"
      - "Eight system designs whiteboarded out loud, two recorded and watched back"
      - "OWASP LLM Top 10 reviewed against your own code, with real fixes committed"
      - "One written postmortem"

  # ─────────────────────────────────────────────────────────── STAGE 6
  - idx: 6
    code: s6
    title: Capstone and portfolio
    outcome: "I have three flagship systems and I'm interviewing."
    modules:
      - { code: s6.1, title: "Capstone — AI hiring copilot (you name it)", priority: core, topic_count: 4 }
      - { code: s6.2, title: "One specialisation", priority: core, topic_count: 3 }
      - { code: s6.3, title: "Portfolio", priority: core, topic_count: 4 }
      - { code: s6.4, title: "Interview preparation", priority: core, topic_count: 4 }
      - { code: s6.5, title: "Applications as a pipeline", priority: core, topic_count: 2 }
    projects: [p-6.1]
    readiness:
      - "Capstone live, multi-tenant, real users, with a tenant-isolation test"
      - "Three flagship projects with architecture docs, numbers and demo videos"
      - "GitHub, LinkedIn and site consistent and evidence-led"
      - "Twelve mock system designs, some with another person"
      - "Applications out, pipeline tracked"

  # ─────────────────────────────────────────────────────────── STAGE 7
  - idx: 7
    code: s7
    title: Interviews, depth, optionality
    outcome: "Offers — and a body of work that compounds either way."
    modules:
      - { code: s7.1, title: "Interview execution and same-day debriefs", priority: core, topic_count: 3 }
      - { code: s7.2, title: "Depth on demand — fill the gap the interview exposed", priority: core, topic_count: 3 }
      - { code: s7.3, title: "Optional deep dives: LoRA, vLLM, GraphRAG, voice, DSPy", priority: optional, topic_count: 4 }
      - { code: s7.4, title: "Negotiation and screening a role for real AI work", priority: core, topic_count: 2 }
    projects: [p-7.1]
    readiness:
      - "Every round debriefed in writing the same day"
      - "Each exposed gap closed before the next round"

# ─────────────────────────────────────────────────────── if you need to cut
cut_order: [optional modules, secondary projects, specialisation depth]
never_cut:
  - the evaluation work (s3.8 and s5.5)
  - the deploys
  - the readiness self-checks
rationale: >
  These three are the difference between finishing this path and finishing a playlist.

# ─────────────────────────────────────────────────────── stopping and returning
pause_and_resume:
  expected: true               # exams, illness, busy months — costs nothing but elapsed time
  on_return:
    - open exactly where you stopped
    - 'a "where you left off" card: what you had just learned and what you were building'
    - two-minute refresher of the last three concepts
    - due flashcards capped so returning never feels like a backlog
    - optional one-screen recap of the current stage
